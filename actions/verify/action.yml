name: Verify actions.lock
description: Fail when .github/workflows/actions.lock is out of sync with the workflows or a locked pin no longer verifies upstream

inputs:
  token:
    description: Token the CLI uses to read action repositories. The default GITHUB_TOKEN can't read private or internal actions in other repositories; pass a GitHub App installation token for those.
    required: false
    default: ${{ github.token }}
  version:
    description: gh-actions-lock release to run, such as v0.4.1. Release tags of this action default it to the CLI release they were cut with.
    required: false
    default: "" # stamped by script/verify-action-release.mjs
  args:
    description: Arguments passed to gh-actions-lock, split on whitespace.
    required: false
    default: --verify

runs:
  using: composite
  steps:
    - name: Verify actions.lock
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ARGS: ${{ inputs.args }}
      run: node "$GITHUB_ACTION_PATH/verify.mjs"

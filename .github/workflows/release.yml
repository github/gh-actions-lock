name: Release

on:
  push:
    tags:
      - v*
      - "!verify-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag
        run: script/verify-release-tag "$GITHUB_REF_NAME" v

      - uses: cli/gh-extension-precompile@v2.2.0
        with:
          generate_attestations: true
          go_version_file: go.mod
          go_build_options: ./cmd/gh-actions-lock

  stamp-verify-action:
    name: Stamp verify action
    needs: publish
    permissions:
      contents: write
      attestations: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Stamp and tag verify-${{ github.ref_name }}
        run: node script/verify-action-release.mjs "$TAG"

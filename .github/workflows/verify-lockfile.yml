# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.
#
# This repository runs its own actions/verify from the checkout, so the
# version is set here. Other repositories pin a verify-v* tag instead; see
# actions/verify/README.md.

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/verify
        with:
          version: v0.4.1
